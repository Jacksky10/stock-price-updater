name: Update stock prices

on:
  workflow_dispatch:

  schedule:
    # Runs at 7:17 AM Perth time, Tuesday-Saturday.
    # This captures the preceding US and Australian trading day.
    - cron: "17 7 * * 2-6"
      timezone: "Australia/Perth"

permissions:
  contents: write

jobs:
  update-prices:
    runs-on: ubuntu-latest

    steps:
      - name: Download repository
        uses: actions/checkout@v7

      - name: Install Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip

      - name: Install required packages
        run: python -m pip install -r requirements.txt

      - name: Run price updater
        env:
          EODHD_API_TOKEN: ${{ secrets.EODHD_API_TOKEN }}
        run: python update_prices.py

      - name: Save updated CSV
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -- eodhd_daily_prices.csv

          if git diff --cached --quiet; then
            echo "No new price data."
          else
            git commit -m "Update daily stock prices"
            git push
          fi
